<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1c2c; --panel: #333c57; --ink: #f4f4f4; --dim: #94b0c2;
    --gold: #ffd23f; --red: #e63946; --green: #38b764; --blue: #41a6f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 10px/1.6 "Press Start 2P", monospace; display: flex; justify-content: center;
    padding: 16px;
  }
  main { width: 100%; max-width: 960px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; color: var(--gold); text-shadow: 2px 2px 0 var(--red); }
  .hud { display: flex; align-items: center; gap: 10px; }
  #coinIcon { width: 24px; height: 24px; image-rendering: pixelated; }
  #coins { font-size: 14px; color: var(--gold); min-width: 90px; text-align: right; }
  canvas#c {
    display: block; width: 100%; image-rendering: pixelated; background: #000;
    border: 4px solid var(--ink); box-shadow: 0 0 0 4px var(--panel), 8px 8px 0 4px #000;
  }
  #msg { min-height: 40px; margin: 16px 0 8px; color: var(--gold); text-align: center; font-size: 11px; }
  #panel { background: var(--panel); border: 4px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .label { color: var(--dim); width: 100%; text-align: center; font-size: 9px; }
  button {
    font: inherit; color: var(--ink); background: #566c86; border: 3px solid var(--ink);
    padding: 10px 12px; cursor: pointer; box-shadow: 3px 3px 0 #000; text-transform: uppercase;
  }
  button:hover:not(:disabled) { background: #73eff7; color: #000; }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.sel { background: var(--gold); color: #000; }
  button.go { background: var(--green); }
  button.big { padding: 18px 20px; font-size: 12px; }
  button.small { font-size: 8px; padding: 6px 8px; }
  .help { color: var(--dim); font-size: 8px; text-align: center; }
  footer { margin-top: 14px; color: var(--dim); font-size: 8px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PIXEL CASINO</h1>
    <div class="hud">
      <button class="small" id="muteBtn">Sonido: ON</button>
      <canvas id="coinIcon" width="8" height="8"></canvas>
      <div id="coins">0</div>
    </div>
  </header>
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div id="panel"></div>
  <footer>Juego de ficcion con monedas virtuales. No se usa dinero real.</footer>
</main>

<script>
'use strict';
// ---------- Canvas / helpers ----------
const W = 320, H = 180;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const PAL = {
  k: '#1a1c2c', w: '#f4f4f4', r: '#e63946', y: '#ffd23f', o: '#f77f00', g: '#38b764',
  G: '#257179', b: '#3b5dc9', B: '#41a6f6', p: '#b13e53', P: '#5d275d', s: '#94b0c2', S: '#566c86', c: '#73eff7'
};
function mk(rows, over) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    const col = (over && over[ch]) || PAL[ch];
    if (col && ch !== '.') { x.fillStyle = col; x.fillRect(i, j, 1, 1); }
  }));
  return c;
}
const mod = (a, n) => ((a % n) + n) % n;
const rnd = (a, b) => a + Math.random() * (b - a);

function txt(s, x, y, color = '#f4f4f4', size = 8, align = 'left', shadow = '#000') {
  ctx.font = size + 'px "Press Start 2P", monospace';
  ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function spr(img, x, y, scale = 1) {
  ctx.drawImage(img, Math.round(x), Math.round(y), img.width * scale, img.height * scale);
}
function box(x, y, w, h, fill, edge = '#1a1c2c') { rect(x - 1, y - 1, w + 2, h + 2, edge); rect(x, y, w, h, fill); }

// ---------- Sprites ----------
const COIN = mk([
  '..oooo..', '.oyyyyo.', 'oyyooyyo', 'oyyoyyyo', 'oyyooyyo', 'oyyyoyyo', '.oyyyyo.', '..oooo..']);
const SYM = [
  mk(['............', '........gg..', '.......g.g..', '......g..g..', '.....g...g..', '..rr.g..rr..', '.rrrr..rrrr.',
      '.rwrr..rwrr.', '.rrrr..rrrr.', '..rr....rr..']),
  mk(['............', '....oooo....', '..oyyyyyyo..', '.oyywyyyyyo.', '.oyyyyyyyyo.', '.oyyyyyyyyo.',
      '..oyyyyyyo..', '....oooo....']),
  mk(['............', '..oooooooo..', '.oyyyyyyyyo.', 'oywyyyyyyyyo', 'oyyyyyyyyyyo', 'oyyyyyyyyyyo',
      'ooooooooooo.', '.oyyyyyyyyo.', 'oyyyyyyyyyyo', 'oooooooooooo']),
  mk(['..bbbbbbbb..', '.bBBwBBBBBb.', 'bBBBBBBBBBBb', '.bBBBBBBBBb.', '..bBBBBBBb..', '...bBBBBb...',
      '....bBBb....', '.....bb.....']),
  mk(['kkkkkkkkkkk.', 'rrrrrrrrrrk.', 'rwrrrrrrrrk.', '........rrk.', '.......rrk..', '......rrk...',
      '.....rrk....', '....rrk.....', '...rrk......', '...rrk......'])
];
const SYM_NAME = ['cereza', 'limon', 'oro', 'diamante', 'siete'];
const SYM_W = [30, 25, 20, 15, 10];
const SYM_PAY = [5, 8, 15, 25, 50];

const HORSE_ROWS = (legs) => [
  '......jj........', '.....jjjj.......',
  '...........dd...', '..........dbbb..', '.dd......dbbbbk.', 'dd.....dbbbbbbb.',
  'd.....bbbbbbbb..', 'd...bbbbbbbbbb..', '....bbbbbbbbbb..', '....bbbbbbbbbb..', '....bbbbbbbbb...',
  ...legs
];
const LEGS_A = ['...bl..bl..bl.bl', '...l...l...l..l.'];
const LEGS_B = ['..bl.bl....bl.bl', '.l...l.....l...l'];
const HORSES = [
  { n: 'Relampago', s: 1.0, body: '#8b5a2b', mane: '#3a2410', jk: '#e63946' },
  { n: 'Nube', s: 0.98, body: '#f4f4f4', mane: '#94b0c2', jk: '#41a6f6' },
  { n: 'Sombra', s: 0.96, body: '#4a4a5a', mane: '#1a1c2c', jk: '#38b764' },
  { n: 'Dorado', s: 0.94, body: '#d9a066', mane: '#b86f50', jk: '#b13e53' }
];
HORSES.forEach(h => {
  const o = { b: h.body, d: h.mane, j: h.jk, l: '#1a1c2c', k: '#1a1c2c' };
  h.frames = [mk(HORSE_ROWS(LEGS_A), o), mk(HORSE_ROWS(LEGS_B), o)];
});

// ---------- Audio ----------
let AC = null, muted = false;
function beep(f, d = 0.08, type = 'square', v = 0.04, when = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime + when;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d);
  } catch (e) { /* audio unavailable */ }
}
const jingle = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, 'square', 0.05, i * 0.09));
const sad = () => [330, 262, 196].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i * 0.12));

// ---------- State ----------
const KEY = 'pixelcasino.coins';
const S = { coins: 100, bet: 10, busy: false, scene: 'lobby' };
try { const v = parseInt(localStorage.getItem(KEY), 10); if (v >= 0) S.coins = v; } catch (e) { /* no storage */ }

const $coins = document.getElementById('coins');
const $msg = document.getElementById('msg');
const $panel = document.getElementById('panel');
function setCoins(n) {
  S.coins = Math.max(0, Math.floor(n));
  $coins.textContent = S.coins;
  try { localStorage.setItem(KEY, S.coins); } catch (e) { /* no storage */ }
}
function say(m) { $msg.textContent = m; }
document.getElementById('coinIcon').getContext('2d').drawImage(COIN, 0, 0);
document.getElementById('muteBtn').onclick = (e) => {
  muted = !muted; e.target.textContent = 'Sonido: ' + (muted ? 'OFF' : 'ON');
};

// ---------- Scenes ----------
const BETS = [5, 10, 25, 50, 100];
function betRow() {
  return '<div class="row"><span class="label">APUESTA</span>' + BETS.map(b =>
    `<button data-a="bet" data-v="${b}" class="${S.bet === b ? 'sel' : ''}" ${S.busy || b > S.coins ? 'disabled' : ''}>${b}</button>`
  ).join('') + '</div>';
}
function backRow() {
  return `<div class="row"><button class="small" data-a="go" data-v="lobby" ${S.busy ? 'disabled' : ''}>Volver al lobby</button></div>`;
}
function loanRow() {
  return S.coins < 5 && !S.busy
    ? '<div class="row"><button data-a="loan">Sin monedas: pedir prestamo +50</button></div>' : '';
}

function weighted() {
  let r = Math.random() * 100;
  for (let i = 0; i < SYM_W.length; i++) { if ((r -= SYM_W[i]) < 0) return i; }
  return 0;
}

const scenes = {};

// Lobby
scenes.lobby = {
  t: 0,
  stars: Array.from({ length: 40 }, () => ({ x: rnd(0, W), y: rnd(0, 100), p: rnd(0, 6) })),
  enter() {
    say('Elige un juego. Empiezas con 100 monedas.');
    this.panel();
  },
  panel() {
    $panel.innerHTML = `<div class="row">
      <button class="big" data-a="go" data-v="slots">Tragaperras</button>
      <button class="big" data-a="go" data-v="race">Carreras</button>
      <button class="big" data-a="go" data-v="dice">Dados</button>
      <button class="big" data-a="go" data-v="roulette">Ruleta</button></div>
      ${loanRow()}
      <div class="row"><button class="small" data-a="reset">Reiniciar partida</button></div>`;
  },
  update(dt) { this.t += dt; },
  draw() {
    ['#0d0f1f', '#1a1c2c', '#29366f', '#3b5dc9'].forEach((c, i) => rect(0, i * 28, W, 28, c));
    this.stars.forEach(s => { if (Math.sin(this.t * 3 + s.p) > -0.3) rect(s.x, s.y, 1, 1, '#f4f4f4'); });
    // casino facade
    box(60, 82, 200, 80, '#5d275d');
    rect(60, 82, 200, 6, '#b13e53');
    for (let i = 0; i < 25; i++) {
      const on = (Math.floor(this.t * 4) + i) % 2 === 0;
      rect(62 + i * 8, 84, 3, 3, on ? '#ffd23f' : '#f77f00');
    }
    box(140, 118, 40, 44, '#1a1c2c');
    rect(158, 118, 4, 44, '#566c86');
    [[76, 100], [212, 100]].forEach(([x, y]) => { box(x, y, 32, 40, '#73eff7'); rect(x + 15, y, 2, 40, '#1a1c2c'); });
    txt('PIXEL', 160, 24, '#ffd23f', 18, 'center', '#e63946');
    txt('CASINO', 160, 48, '#f4f4f4', 18, 'center', '#e63946');
    const sx = Math.abs(Math.cos(this.t * 3));
    ctx.drawImage(COIN, 160 - 12 * sx, 98, 24 * sx, 16);
    txt('Saldo: ' + S.coins, 160, 168, '#ffd23f', 8, 'center');
  }
};

// Slots
scenes.slots = {
  t: 0, flash: 0, result: null,
  reels: [0, 1, 2].map(() => ({ pos: 0, start: 0, target: 0, t: 0, dur: 1, run: false })),
  enter() { say('Pulsa GIRAR. Tres iguales pagan premio; dos cerezas pagan x2.'); this.panel(); },
  panel() {
    $panel.innerHTML = betRow() + `<div class="row">
      <button class="big go" data-a="spin" ${S.busy || S.coins < S.bet ? 'disabled' : ''}>Girar</button></div>
      <div class="help">3 cerezas x5 | 3 limones x8 | 3 oros x15 | 3 diamantes x25 | 3 sietes x50 | 2 cerezas x2</div>
      ${loanRow()}${backRow()}`;
  },
  spin() {
    if (S.busy || S.coins < S.bet) return;
    S.busy = true; setCoins(S.coins - S.bet); this.result = null; this.flash = 0;
    say('Girando...');
    const fin = [weighted(), weighted(), weighted()];
    this.reels.forEach((r, i) => {
      r.start = r.pos; let tg = Math.ceil(r.pos) + 10 + i * 6;
      while (mod(tg, 5) !== fin[i]) tg++;
      r.target = tg; r.dur = 1.2 + i * 0.5; r.t = 0; r.run = true;
    });
    this.panel();
  },
  finish() {
    const ids = this.reels.map(r => mod(r.target, 5));
    let win = 0;
    if (ids[0] === ids[1] && ids[1] === ids[2]) win = S.bet * SYM_PAY[ids[0]];
    else if (ids.filter(i => i === 0).length === 2) win = S.bet * 2;
    this.result = win;
    if (win) { setCoins(S.coins + win); this.flash = 2.5; jingle(); say(`GANASTE ${win} monedas!`); }
    else { sad(); say('Sin premio. Prueba otra vez.'); }
    S.busy = false; this.panel();
  },
  update(dt) {
    this.t += dt; if (this.flash > 0) this.flash -= dt;
    let any = false;
    this.reels.forEach(r => {
      if (!r.run) return;
      any = true; r.t += dt;
      const k = Math.min(1, r.t / r.dur), e = 1 - Math.pow(1 - k, 3);
      const before = Math.floor(r.pos);
      r.pos = r.start + (r.target - r.start) * e;
      if (Math.floor(r.pos) !== before) beep(900, 0.02, 'square', 0.015);
      if (k >= 1) { r.run = false; r.pos = r.target; beep(440, 0.1, 'square', 0.05); }
    });
    if (any === false && S.busy && this.reels.every(r => !r.run) && S.scene === 'slots') this.finish();
  },
  draw() {
    for (let i = 0; i < 16; i++) rect(i * 20, 0, 20, H, i % 2 ? '#b13e53' : '#5d275d');
    box(50, 8, 220, 164, '#ffd23f', '#f77f00');
    rect(56, 14, 208, 152, '#333c57');
    txt('TRAGAPERRAS', 160, 20, '#ffd23f', 10, 'center', '#e63946');
    // lamps
    for (let i = 0; i < 12; i++) {
      const on = (Math.floor(this.t * (this.flash > 0 ? 8 : 3)) + i) % 2 === 0;
      rect(62 + i * 17, 36, 4, 4, on ? '#ffd23f' : '#8b5a2b');
    }
    // reels
    this.reels.forEach((r, i) => {
      const x = 76 + i * 60, y = 50, w = 48, h = 60;
      box(x, y, w, h, '#f4f4f4');
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      const sz = 20 * 3 / 3 * 2; // spacing between symbols
      for (let k = Math.floor(r.pos) - 2; k <= Math.floor(r.pos) + 3; k++) {
        const img = SYM[mod(k, 5)];
        const cy = y + h / 2 + (k - r.pos) * sz;
        ctx.drawImage(img, Math.round(x + w / 2 - img.width * 1.5), Math.round(cy - img.height * 1.5), img.width * 3, img.height * 3);
      }
      ctx.restore();
      rect(x, y, w, 8, 'rgba(0,0,0,0.25)'); rect(x, y + h - 8, w, 8, 'rgba(0,0,0,0.25)');
    });
    rect(70, 79, 180, 2, '#e63946');
    if (this.result !== null) {
      if (this.result > 0) txt('+' + this.result, 160, 128, Math.floor(this.t * 6) % 2 ? '#ffd23f' : '#f4f4f4', 14, 'center', '#e63946');
      else txt('...', 160, 128, '#94b0c2', 14, 'center');
    }
    txt('Apuesta ' + S.bet, 160, 152, '#73eff7', 8, 'center');
  }
};

// Race
const FINISH = 292, START_X = 24, TICK = 1 / 30, SPEED = 0.42;
// each race draws a random "form of the day" per horse so favourites can still lose
function newRace() {
  return { p: [0, 0, 0, 0], v: [0, 0, 0, 0], f: HORSES.map(h => h.s * rnd(0.88, 1.12)) };
}
function stepRace(st) {
  for (let i = 0; i < 4; i++) {
    st.v[i] += (st.f[i] * rnd(0.4, 1.6) * SPEED - st.v[i]) * 0.1;
    st.p[i] += st.v[i];
  }
}
function simWinner() {
  const st = newRace();
  while (Math.max(...st.p) < 100) stepRace(st);
  return st.p.indexOf(Math.max(...st.p));
}
const ODDS = (() => {
  const wins = [0, 0, 0, 0], n = 1500;
  for (let i = 0; i < n; i++) wins[simWinner()]++;
  return wins.map(w => w ? Math.min(20, Math.max(1.3, Math.round(0.92 / (w / n) * 10) / 10)) : 20);
})();

scenes.race = {
  t: 0, phase: 'idle', pick: 0, cd: 0, acc: 0, winner: -1, st: null,
  enter() { this.phase = 'idle'; this.winner = -1; this.st = newRace(); say('Elige tu caballo y la apuesta.'); this.panel(); },
  panel() {
    $panel.innerHTML = betRow() + '<div class="row"><span class="label">CABALLO (cuota)</span>' +
      HORSES.map((h, i) => `<button data-a="pick" data-v="${i}" class="${this.pick === i ? 'sel' : ''}" ${S.busy ? 'disabled' : ''}>${i + 1} ${h.n} x${ODDS[i].toFixed(1)}</button>`).join('') +
      `</div><div class="row"><button class="big go" data-a="start" ${S.busy || S.coins < S.bet ? 'disabled' : ''}>A correr!</button></div>
      ${loanRow()}${backRow()}`;
  },
  start() {
    if (S.busy || S.coins < S.bet) return;
    S.busy = true; setCoins(S.coins - S.bet);
    this.st = newRace(); this.phase = 'count'; this.cd = 3; this.winner = -1;
    say(`Apostaste ${S.bet} a ${HORSES[this.pick].n}.`); this.panel();
  },
  update(dt) {
    this.t += dt;
    if (this.phase === 'count') {
      const before = Math.ceil(this.cd); this.cd -= dt;
      if (Math.ceil(this.cd) !== before) beep(this.cd > 0 ? 440 : 880, 0.15);
      if (this.cd <= 0) { this.phase = 'run'; this.acc = 0; }
    } else if (this.phase === 'run') {
      this.acc += dt;
      while (this.acc >= TICK && this.phase === 'run') {
        this.acc -= TICK; stepRace(this.st);
        if (Math.max(...this.st.p) >= 100) this.end();
      }
    }
  },
  end() {
    this.phase = 'done';
    this.winner = this.st.p.indexOf(Math.max(...this.st.p));
    if (this.winner === this.pick) {
      const win = Math.floor(S.bet * ODDS[this.pick]);
      setCoins(S.coins + win); jingle(); say(`Gano ${HORSES[this.winner].n}! Ganas ${win} monedas.`);
    } else { sad(); say(`Gano ${HORSES[this.winner].n}. Perdiste ${S.bet}.`); }
    S.busy = false; this.panel();
  },
  draw() {
    rect(0, 0, W, 44, '#41a6f6'); rect(0, 44, W, H - 44, '#38b764');
    [[30, 8], [140, 14], [250, 6]].forEach(([x, y]) => { rect(x, y, 30, 6, '#f4f4f4'); rect(x + 6, y - 4, 16, 4, '#f4f4f4'); });
    // grandstand
    rect(0, 24, W, 22, '#566c86'); rect(0, 24, W, 3, '#94b0c2');
    const cols = ['#e63946', '#ffd23f', '#f4f4f4', '#41a6f6', '#b13e53'];
    for (let i = 0; i < 64; i++) {
      const bob = this.phase === 'run' ? Math.abs(Math.sin(this.t * 8 + i)) * 2 : 0;
      rect(4 + i * 5, 32 + (i % 3) * 4 - bob, 3, 3, cols[i % 5]);
    }
    // lanes
    for (let i = 0; i < 4; i++) {
      const y = 50 + i * 32;
      rect(0, y, W, 30, i % 2 ? '#a77a4a' : '#b8894f');
      rect(0, y + 30, W, 2, '#f4f4f4');
      txt(String(i + 1), 6, y + 10, '#1a1c2c', 8, 'left', null);
    }
    // finish line
    for (let j = 0; j < 128 / 4; j++) { rect(FINISH + 14, 50 + j * 4, 4, 4, j % 2 ? '#1a1c2c' : '#f4f4f4'); rect(FINISH + 18, 50 + j * 4, 4, 4, j % 2 ? '#f4f4f4' : '#1a1c2c'); }
    // horses
    HORSES.forEach((h, i) => {
      const p = this.st ? Math.min(100, this.st.p[i]) : 0;
      const x = START_X + p / 100 * (FINISH - START_X);
      const y = 50 + i * 32 + 12 + (this.phase === 'run' ? Math.round(Math.sin(this.t * 14 + i)) : 0);
      const fr = this.phase === 'run' ? Math.floor(this.t * 10 + i) % 2 : 0;
      rect(x + 1, y + 14, 14, 2, 'rgba(0,0,0,0.25)');
      spr(h.frames[fr], x, y);
      if (this.pick === i) { rect(x + 6, y - 6, 4, 2, '#ffd23f'); rect(x + 7, y - 4, 2, 2, '#ffd23f'); }
    });
    if (this.phase === 'count') txt(this.cd > 0 ? String(Math.ceil(this.cd)) : 'YA!', 160, 70, '#ffd23f', 40, 'center', '#e63946');
    if (this.phase === 'done') {
      box(70, 70, 180, 40, '#333c57');
      txt('GANADOR', 160, 76, '#ffd23f', 8, 'center');
      txt(HORSES[this.winner].n, 160, 92, '#f4f4f4', 10, 'center');
    }
  }
};

// Dice
const PIPS = {
  1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
  6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]]
};
function drawDie(x, y, n, shake) {
  const s = 44;
  rect(x + 3, y + 3, s, s, 'rgba(0,0,0,0.35)');
  box(x, y, s, s, '#f4f4f4', '#1a1c2c');
  rect(x + 2, y + 2, s - 4, 2, '#fff'); rect(x + 2, y + s - 4, s - 4, 2, '#cbd5e1');
  PIPS[n].forEach(([i, j]) => rect(x + 8 + i * 13, y + 8 + j * 13, 8, 8, '#1a1c2c'));
}
const DICE_MODES = {
  low: { label: 'Bajo (2-6)', mult: 2.2, ok: t => t < 7 },
  seven: { label: 'Siete', mult: 5.5, ok: t => t === 7 },
  high: { label: 'Alto (8-12)', mult: 2.2, ok: t => t > 7 }
};
scenes.dice = {
  t: 0, a: 3, b: 4, roll: 0, mode: null, fin: [3, 4],
  enter() { say('Apuesta si la suma de los dos dados sera baja, siete o alta.'); this.panel(); },
  panel() {
    $panel.innerHTML = betRow() + '<div class="row"><span class="label">TU APUESTA</span>' +
      Object.entries(DICE_MODES).map(([k, m]) =>
        `<button class="go" data-a="roll" data-v="${k}" ${S.busy || S.coins < S.bet ? 'disabled' : ''}>${m.label} x${m.mult}</button>`).join('') +
      `</div>${loanRow()}${backRow()}`;
  },
  start(mode) {
    if (S.busy || S.coins < S.bet) return;
    S.busy = true; setCoins(S.coins - S.bet);
    this.mode = mode; this.roll = 1.3; this.fin = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    say('Tirando los dados...'); this.panel();
  },
  update(dt) {
    this.t += dt;
    if (this.roll > 0) {
      const before = Math.floor(this.t * 14);
      this.roll -= dt;
      if (Math.floor(this.t * 14) !== before) { this.a = 1 + Math.floor(Math.random() * 6); this.b = 1 + Math.floor(Math.random() * 6); beep(300 + Math.random() * 200, 0.03, 'square', 0.02); }
      if (this.roll <= 0) {
        [this.a, this.b] = this.fin;
        const total = this.a + this.b, m = DICE_MODES[this.mode];
        if (m.ok(total)) { const win = Math.floor(S.bet * m.mult); setCoins(S.coins + win); jingle(); say(`Salio ${total}. Ganas ${win} monedas!`); }
        else { sad(); say(`Salio ${total}. Perdiste ${S.bet}.`); }
        S.busy = false; this.panel();
      }
    }
  },
  draw() {
    rect(0, 0, W, H, '#1a1c2c');
    box(20, 16, 280, 148, '#257179', '#8b5a2b'); rect(24, 20, 272, 140, '#38b764');
    for (let i = 0; i < 20; i++) rect(30 + (i * 53) % 260, 28 + (i * 37) % 120, 1, 1, '#2f9a58');
    txt('DADOS', 160, 28, '#ffd23f', 12, 'center', '#257179');
    const rolling = this.roll > 0;
    const jig = rolling ? Math.round(Math.sin(this.t * 40) * 2) : 0;
    drawDie(94, 66 + jig, this.a); drawDie(182, 66 - jig, this.b);
    txt('Suma: ' + (this.a + this.b), 160, 128, '#f4f4f4', 10, 'center');
  }
};

// Roulette (European, single zero)
const R_ORDER = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const R_RED = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
const rColor = n => n === 0 ? 'green' : R_RED.has(n) ? 'red' : 'black';
const R_HEX = { green: '#38b764', red: '#e63946', black: '#1a1c2c' };
const R_BETS = {
  red: { label: 'Rojo', mult: 2, ok: n => rColor(n) === 'red' },
  black: { label: 'Negro', mult: 2, ok: n => rColor(n) === 'black' },
  even: { label: 'Par', mult: 2, ok: n => n > 0 && n % 2 === 0 },
  odd: { label: 'Impar', mult: 2, ok: n => n % 2 === 1 },
  low: { label: '1-18', mult: 2, ok: n => n >= 1 && n <= 18 },
  high: { label: '19-36', mult: 2, ok: n => n >= 19 },
  d1: { label: '1-12', mult: 3, ok: n => n >= 1 && n <= 12 },
  d2: { label: '13-24', mult: 3, ok: n => n >= 13 && n <= 24 },
  d3: { label: '25-36', mult: 3, ok: n => n >= 25 },
  pleno: { label: 'Pleno', mult: 36, ok: (n, c) => n === c.num }
};
const R_STEP = Math.PI * 2 / 37, R_CX = 106, R_CY = 90, R_R = 76;
scenes.roulette = {
  t: 0, choice: { type: 'red', num: 17 }, spinT: 0, dur: 5, w0: 0, wEnd: 0, ang: 0, ballR: 69, ballA: 0,
  result: null, hist: [], pend: null,
  enter() { say('Elige tu apuesta y pulsa GIRAR. El cero pierde todo.'); this.panel(); },
  panel() {
    const c = this.choice, dis = S.busy ? 'disabled' : '';
    $panel.innerHTML = betRow() + '<div class="row"><span class="label">TU APUESTA (rojo/negro/par/impar/mitad x2, docena x3, pleno x36)</span>' +
      Object.entries(R_BETS).filter(([k]) => k !== 'pleno').map(([k, b]) =>
        `<button data-a="rpick" data-v="${k}" class="${c.type === k ? 'sel' : ''}" ${dis}>${b.label}</button>`).join('') +
      `<button data-a="rpick" data-v="pleno" class="${c.type === 'pleno' ? 'sel' : ''}" ${dis}>Pleno</button>
      <input id="rnum" type="number" min="0" max="36" value="${c.num}" ${dis} style="width:64px;font:inherit;padding:8px;background:#1a1c2c;color:#f4f4f4;border:3px solid #f4f4f4"></div>
      <div class="row"><button class="big go" data-a="rspin" ${S.busy || S.coins < S.bet ? 'disabled' : ''}>Girar</button></div>
      ${loanRow()}${backRow()}`;
  },
  spin() {
    if (S.busy || S.coins < S.bet) return;
    const inp = document.getElementById('rnum');
    if (inp) this.choice.num = Math.min(36, Math.max(0, parseInt(inp.value, 10) || 0));
    S.busy = true; setCoins(S.coins - S.bet);
    this.pend = Math.floor(Math.random() * 37); this.result = null;
    this.spinT = 0; this.w0 = this.ang; this.wEnd = this.w0 + Math.PI * 2 * 3;
    say('No va mas...'); this.panel();
  },
  finish() {
    const n = this.pend, c = this.choice, b = R_BETS[c.type];
    this.result = n; this.hist.unshift(n); this.hist = this.hist.slice(0, 8);
    if (b.ok(n, c)) { const win = S.bet * b.mult; setCoins(S.coins + win); jingle(); say(`Salio ${n} ${rColor(n)}. Ganas ${win} monedas!`); }
    else { sad(); say(`Salio ${n} ${rColor(n)}. Perdiste ${S.bet}.`); }
    S.busy = false; this.pend = null; this.panel();
  },
  update(dt) {
    this.t += dt;
    if (this.pend === null) {
      this.ang += dt * 0.15;
      if (this.result !== null) this.ballA = this.ang + R_ORDER.indexOf(this.result) * R_STEP; // ball rides with its pocket
      return;
    }
    this.spinT += dt;
    const k = Math.min(1, this.spinT / this.dur), e = 1 - Math.pow(1 - k, 2);
    this.ang = this.w0 + (this.wEnd - this.w0) * e;
    const idx = R_ORDER.indexOf(this.pend);
    // ball orbits against the wheel, then drops into the winning pocket
    const off = -(1 - Math.pow(k, 0.6)) * Math.PI * 2 * 7;
    this.ballA = this.ang + idx * R_STEP + off;
    this.ballR = 69 - 9 * Math.pow(Math.max(0, (k - 0.7) / 0.3), 2);
    if (Math.floor(this.spinT * 18) !== Math.floor((this.spinT - dt) * 18) && k < 0.9) beep(1200, 0.015, 'square', 0.01);
    if (k >= 1) this.finish();
  },
  draw() {
    rect(0, 0, W, H, '#1a1c2c'); box(4, 4, W - 8, H - 8, '#257179', '#8b5a2b');
    for (let y = -R_R; y <= R_R; y++) for (let x = -R_R; x <= R_R; x++) {
      const d = Math.sqrt(x * x + y * y); if (d > R_R) continue;
      let col;
      if (d > 70) col = '#8b5a2b';
      else if (d > 68) col = '#566c86';
      else if (d > 52) {
        const a = Math.atan2(y, x) - this.ang;
        const i = Math.floor(mod(a + R_STEP / 2, Math.PI * 2) / R_STEP);
        col = R_HEX[rColor(R_ORDER[i])];
        if (d < 54 || (mod(a + R_STEP / 2, Math.PI * 2) / R_STEP) % 1 < 0.06) col = '#ffd23f';
      } else if (d > 20) col = '#333c57';
      else if (d > 6) col = '#b13e53';
      else col = '#ffd23f';
      rect(R_CX + x, R_CY + y, 1, 1, col);
    }
    // spokes
    for (let i = 0; i < 4; i++) { const a = this.ang + i * Math.PI / 2; for (let r = 7; r < 20; r++) rect(R_CX + Math.cos(a) * r, R_CY + Math.sin(a) * r, 2, 2, '#ffd23f'); }
    const bx = R_CX + Math.cos(this.ballA) * this.ballR, by = R_CY + Math.sin(this.ballA) * this.ballR;
    rect(bx - 1, by - 1, 3, 3, '#f4f4f4'); rect(bx, by, 1, 1, '#cbd5e1');
    // right side: result + history
    txt('RULETA', 240, 14, '#ffd23f', 12, 'center', '#e63946');
    if (this.result !== null && this.pend === null) {
      box(212, 38, 56, 44, R_HEX[rColor(this.result)], '#f4f4f4');
      txt(String(this.result), 240, 52, '#f4f4f4', 16, 'center');
    } else box(212, 38, 56, 44, '#333c57', '#f4f4f4');
    txt('Ultimos', 240, 94, '#94b0c2', 8, 'center');
    this.hist.forEach((n, i) => {
      const x = 196 + (i % 4) * 24, y = 108 + Math.floor(i / 4) * 22;
      box(x, y, 20, 18, R_HEX[rColor(n)], '#f4f4f4'); txt(String(n), x + 10, y + 5, '#f4f4f4', 8, 'center');
    });
    const b = R_BETS[this.choice.type];
    txt(`${b.label}${this.choice.type === 'pleno' ? ' ' + this.choice.num : ''} | ${S.bet}`, 240, 156, '#73eff7', 8, 'center');
  }
};

// ---------- Scene manager & input ----------
function goto(name) {
  S.scene = name; scenes[name].enter();
}
function act(a, v) {
  const sc = scenes[S.scene];
  if (a === 'go') goto(v);
  else if (a === 'bet') { S.bet = +v; sc.panel(); }
  else if (a === 'loan') { setCoins(S.coins + 50); say('El banco te presta 50 monedas.'); sc.panel(); }
  else if (a === 'reset') { setCoins(100); say('Partida reiniciada con 100 monedas.'); sc.panel(); }
  else if (a === 'spin') sc.spin();
  else if (a === 'pick') { sc.pick = +v; sc.panel(); }
  else if (a === 'start') sc.start();
  else if (a === 'roll') sc.start(v);
  else if (a === 'rpick') { sc.choice.type = v; sc.panel(); }
  else if (a === 'rspin') sc.spin();
}
$panel.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (b && !b.disabled) act(b.dataset.a, b.dataset.v);
});

$panel.addEventListener('change', e => {
  if (e.target.id !== 'rnum') return;
  const r = scenes.roulette; r.choice.num = Math.min(36, Math.max(0, parseInt(e.target.value, 10) || 0)); r.choice.type = 'pleno'; r.panel();
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const sc = scenes[S.scene];
  sc.update(dt); sc.draw();
  requestAnimationFrame(frame);
}
setCoins(S.coins);
if (S.coins < 5) S.bet = 5;
goto('lobby');
requestAnimationFrame(frame);
</script>
